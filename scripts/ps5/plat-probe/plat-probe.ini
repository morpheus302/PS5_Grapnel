# Hookshot Platform Probe (PPSA99147): what it runs. Edit in /data/homebrew/PPSA99147/plat-probe.ini over FTP and launch
# again. Lines are key=value; env.NAME=value sets an environment variable before anything (the platform's HOOKSHOT_PS5_*).
#
# tests: all, or a comma list of: bss futex sched eager lazy stacks vk memory files nup data pad (the window is always checked
# first). For the scheduling alone (about 20 s): tests=sched
tests=all
# the scheduling check (probe_sched.c): the virtual cores' pattern, threads sharing cores, beside spinners (0: the title's
# CPUs less two) for sched_seconds a round (4 rounds)
sched_threads=24
sched_cores=6
sched_spinners=0
sched_seconds=3
# the stepped memory test: back and touch guest memory in steps up to the target, stop at the first refusal; never past
# 11 GiB (the probe's cap), and never closer than mem_reserve_mb to an empty pool
mem_target_mb=9216
mem_step_mb=256
mem_reserve_mb=384
# backing on first touch from several threads at once
lazy_threads=8
lazy_mb=128
# threads of 64 MiB stack at once
stack_threads=40
# files open at once through the runtime's CreateFileA (the console allows 249 by path)
fdv_files=320
# the data folder (/data/grapnel since lot 80): the title's own big write (to see whether the throttle applies past ~1.3 GiB), then the broker's
data_write_mb=2048
data_read_mb=1024
broker=1
broker_write_mb=2048
broker_read_mb=256
# an existing big file to time reads of (for instance a romfs file once uploaded), empty for none
read_file=
# the RomFS read in place from the .nup package (host/nup_fs.c): the package, the list made on the PC (shipped beside the
# eboot: game-derived, private), threads reading at random at once and for how long
nup_file=/data/grapnel/game.nup
nup_hashes=/app0/nup-hashes.txt
nup_threads=8
nup_seconds=5
# 1: ask the Lapy daemon for /data when the title does not see it (waits 10 s when no daemon runs)
elevate=0
# the pad's self-test: seconds of button logging, then a tone of this many ms
pad_seconds=10
tone_ms=1000
# a check that makes no progress for this long ends the title with a TIMEOUT line
watchdog_s=60
# the platform's own settings, for instance:
# env.HOOKSHOT_PS5_FAULT_KB=1024
# env.HOOKSHOT_PS5_WINDOW=pieces
# env.HOOKSHOT_PS5_EAGER_MB=256
